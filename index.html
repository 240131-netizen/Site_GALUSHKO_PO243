<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Firebase App: Feed & DM</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .main-layout { display: flex; gap: 20px; width: 100%; max-width: 1000px; align-items: flex-start; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Стили чата */
        .dm-sidebar { width: 250px; position: sticky; top: 20px; }
        .user-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; border-radius: 8px; }
        .user-item:hover { background: #e7f3ff; }
        .user-item.active { background: #007bff; color: white; }
        .chat-window { flex: 1; display: flex; flex-direction: column; height: 500px; background: white; border-radius: 12px; border: 1px solid #ddd; }
        #chatMessages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 70%; font-size: 14px; }
        .msg.sent { align-self: flex-end; background: #007bff; color: white; }
        .msg.received { align-self: flex-start; background: #f1f0f0; color: black; }

        /* Стили ленты */
        .feed-column { flex: 1.5; }
        .auth-bar { display: flex; align-items: center; gap: 15px; padding: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #007bff; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .post { background: white; border: 1px solid #eaeaea; padding: 15px; margin-top: 15px; border-radius: 8px; }
        .post-content-img { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container auth-bar" style="width: 100%; max-width: 960px; justify-content: center;">
        <button id="loginBtn">Войти через Google</button>
        <div id="userInfo" style="display: none; align-items: center; gap: 15px;">
            <img id="userPhoto" class="user-avatar" src="">
            <span id="userName" style="font-weight: bold;"></span>
            <button id="logoutBtn" style="background: #ff4757;">Выйти</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="dm-sidebar container" id="dmSection" style="display: none;">
            <h4>Личные сообщения</h4>
            <div id="userList"></div>
            <hr>
            <div id="activeChat" style="display: none;">
                <div id="chatMessages"></div>
                <input type="text" id="dmInput" placeholder="Сообщение...">
                <button id="sendDmBtn" style="width: 100%;">Отправить</button>
            </div>
        </div>

        <div class="feed-column">
            <div id="messageForm" class="container" style="display: none;">
                <h3>Создать запись в ленту</h3>
                <input type="text" id="content" placeholder="Что у вас нового?">
                <input type="text" id="imgUrl" placeholder="Ссылка на картинку (URL)">
                <button id="mainBtn" style="width: 100%;">Опубликовать</button>
            </div>
            <div id="feed"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, deleteDoc, increment, setDoc, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMU10sdX-NMzO1at3hgLclApVAgwqDu4E",
            authDomain: "galushkodenis-7833b.firebaseapp.com",
            projectId: "galushkodenis-7833b",
            storageBucket: "galushkodenis-7833b.firebasestorage.app",
            messagingSenderId: "176104150786",
            appId: "1:176104150786:web:2d8044114a4fd4a9c0141b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let selectedUser = null;
        let dmUnsubscribe = null;

        // --- АВТОРИЗАЦИЯ ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('messageForm').style.display = 'block';
                document.getElementById('dmSection').style.display = 'block';
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL;

                // Сохраняем себя в список пользователей
                await setDoc(doc(db, "users", user.uid), {
                    name: user.displayName,
                    photo: user.photoURL,
                    uid: user.uid
                });
                loadUsers();
            } else {
                location.reload(); // Простой способ сбросить UI
            }
        });

        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // --- ЛЕНТА (ОБЩАЯ) ---
        document.getElementById('mainBtn').onclick = async () => {
            const text = document.getElementById('content').value;
            const link = document.getElementById('imgUrl').value;
            if(!text) return;
            await addDoc(collection(db, "requests"), {
                name: auth.currentUser.displayName,
                email: auth.currentUser.email,
                photo: auth.currentUser.photoURL,
                text: text,
                externalImg: link,
                likes: 0,
                timestamp: serverTimestamp()
            });
            document.getElementById('content').value = "";
            document.getElementById('imgUrl').value = "";
        };

        onSnapshot(query(collection(db, "requests"), orderBy("timestamp", "desc")), (snap) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                feed.innerHTML += `
                    <div class="post">
                        <b>${d.name}</b> <small>${d.timestamp?.toDate().toLocaleTimeString() || ''}</small>
                        <p>${d.text}</p>
                        ${d.externalImg ? `<img src="${d.externalImg}" class="post-content-img">` : ''}
                    </div>`;
            });
        });

        // --- ЛИЧНЫЕ СООБЩЕНИЯ (DM) ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                snap.forEach(uDoc => {
                    const u = uDoc.data();
                    if(u.uid === auth.currentUser.uid) return;
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerHTML = `<img src="${u.photo}" width="25"> ${u.name}`;
                    div.onclick = () => openChat(u);
                    list.appendChild(div);
                });
            });
        }

       function openChat(user) {
    selectedUser = user;
    const activeChatDiv = document.getElementById('activeChat');
    const chatBox = document.getElementById('chatMessages');
    
    activeChatDiv.style.display = 'block';
    chatBox.innerHTML = "Загрузка чата...";

    // Отписываемся от предыдущего чата, если он был открыт
    if (dmUnsubscribe) {
        dmUnsubscribe();
    }

    // Используем максимально надежный запрос (слушаем всю коллекцию)
    // Firestore сам отфильтрует данные согласно твоим Rules
    const qAll = query(collection(db, "direct_messages"), orderBy("timestamp", "asc"));

    dmUnsubscribe = onSnapshot(qAll, (snap) => {
        chatBox.innerHTML = `<div style="text-align:center; color:gray; font-size:12px; margin-bottom:10px;">Чат с ${user.name}</div>`;
        
        let hasMessages = false;

        snap.forEach(mDoc => {
            const m = mDoc.data();
            
            // Фильтруем: только сообщения между МНОЙ и ВЫБРАННЫМ собеседником
            const isMeToHim = m.senderId === auth.currentUser.uid && m.receiverId === user.uid;
            const isHimToMe = m.senderId === user.uid && m.receiverId === auth.currentUser.uid;

            if (isMeToHim || isHimToMe) {
                hasMessages = true;
                const div = document.createElement('div');
                // Если отправил я — синий пузырь (sent), если он — серый (received)
                div.className = `msg ${m.senderId === auth.currentUser.uid ? 'sent' : 'received'}`;
                div.innerText = m.text;
                chatBox.appendChild(div);
            }
        });

        if (!hasMessages) {
            chatBox.innerHTML += `<div style="text-align:center; color:#ccc; margin-top:20px;">Сообщений пока нет. Напишите первым!</div>`;
        }

        // Автопрокрутка вниз
        chatBox.scrollTop = chatBox.scrollHeight;
    }, (error) => {
        console.error("Ошибка Firebase:", error);
        chatBox.innerHTML = "<span style='color:red'>Ошибка доступа. Проверьте Rules в консоли Firebase!</span>";
    });
}

        document.getElementById('sendDmBtn').onclick = async () => {
            const input = document.getElementById('dmInput');
            if(!input.value || !selectedUser) return;
            await addDoc(collection(db, "direct_messages"), {
                senderId: auth.currentUser.uid,
                receiverId: selectedUser.uid,
                text: input.value,
                timestamp: serverTimestamp()
            });
            input.value = "";
        };

    </script>
</body>
</html>
